name: Build and Release Modpack

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - docs/install-guide.html
      - scripts/build_modpack.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-server-modpack-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build and validate modpack
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_modpack.py

      - name: Read release info
        id: release_info
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          info = json.loads(Path("build/release-info.json").read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={info['effective_version']}\n")
              output.write(f"changed={'true' if info['distribution_changed'] else 'false'}\n")
              output.write(f"version_mode={info['version_mode']}\n")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_VERSION: ${{ steps.release_info.outputs.version }}
        shell: bash
        run: |
          TAG="v${PACK_VERSION}-build.${GITHUB_RUN_NUMBER}"
          TITLE="Test Server Modpack ${PACK_VERSION} (build ${GITHUB_RUN_NUMBER})"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file build/release-notes.md
            gh release upload "$TAG" build/test-server-modpack.zip --clobber
          else
            gh release create "$TAG" build/test-server-modpack.zip \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file build/release-notes.md
          fi

      - name: Notify Discord
        if: steps.release_info.outputs.changed == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping Discord notification."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            --data-binary @build/discord-payload.json \
            "$DISCORD_WEBHOOK_URL"
