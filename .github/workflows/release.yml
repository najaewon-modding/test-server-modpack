name: Build and Release Modpack

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - docs/install-guide.html
      - scripts/build_modpack.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-server-modpack-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build and validate modpack
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_modpack.py

      - name: Package installation guide and finalize Discord payload
        id: distribution
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path

          guide_path = Path("docs/install-guide.html")
          zip_path = Path("build/test-server-modpack.zip")
          payload_path = Path("build/discord-payload.json")

          with zipfile.ZipFile(zip_path, "a", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              archive.write(guide_path, "설치 가이드.html")

          payload = json.loads(payload_path.read_text(encoding="utf-8"))
          embed = payload["embeds"][0]
          embed["title"] = embed["title"].split(" · Build ", 1)[0]
          fields = {field["name"]: field for field in embed["fields"]}
          fields["설치"]["value"] = "압축 파일에 있는 설치 가이드를 참고해주세요"
          should_notify = fields["변경 사항"]["value"] != "모드 구성 변경 없음"
          payload_path.write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"notify={'true' if should_notify else 'false'}\n")
          PY

      - name: Read pack version
        id: pack
        shell: bash
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["pack"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_VERSION: ${{ steps.pack.outputs.version }}
        shell: bash
        run: |
          TAG="v${PACK_VERSION}-build.${GITHUB_RUN_NUMBER}"
          TITLE="Test Server Modpack ${PACK_VERSION} (build ${GITHUB_RUN_NUMBER})"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file build/release-notes.md
            gh release upload "$TAG" build/test-server-modpack.zip --clobber
          else
            gh release create "$TAG" build/test-server-modpack.zip \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file build/release-notes.md
          fi

      - name: Notify Discord
        if: steps.distribution.outputs.notify == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping Discord notification."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            --data-binary @build/discord-payload.json \
            "$DISCORD_WEBHOOK_URL"
